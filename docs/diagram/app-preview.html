<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>保险助手 · 预览</title><style>:root {
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --dsw-bg: rgb(255, 255, 255);
  --dsw-sidebar-fill: rgb(235, 238, 242);
  --dsw-border-l1: rgba(0, 0, 0, 0.04);
  --dsw-border-l2: rgba(0, 0, 0, 0.1);
  --dsw-border-l3: rgba(0, 0, 0, 0.12);
  --dsw-primary: rgb(86, 134, 254);
  --dsw-primary-hover: rgb(65, 118, 230);
  --dsw-primary-soft: rgb(228, 237, 253);
  --dsw-text: rgb(15, 17, 21);
  --dsw-text-2: rgb(127, 130, 135);
  --dsw-text-3: rgb(162, 164, 166);
  --dsw-green: rgb(34, 197, 94);
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { margin: 0; font-family: var(--dsw-font-family); color: var(--dsw-text); background: var(--dsw-bg); font-size: 14px; line-height: 1.5; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--dsw-border-l3); border-radius: 4px; }
.icon { width: 16px; height: 16px; flex-shrink: 0; }

.frame { position: relative; display: flex; flex-direction: row; height: 100vh; overflow: hidden; background: var(--dsw-bg); }
.sidebarCol { flex-shrink: 0; min-width: 0; overflow: hidden; background: var(--dsw-sidebar-fill); border-right: 1px solid var(--dsw-border-l1); display: flex; flex-direction: column; }
.centerCol { flex-shrink: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.detailsCol { flex-shrink: 0; min-width: 0; overflow: hidden; border-left: 1px solid var(--dsw-border-l2); display: flex; flex-direction: column; }
.col-handle { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px; cursor: col-resize; z-index: 4; }
.col-handle:hover { background: rgba(86, 134, 254, 0.18); }
.col-handle.detail { width: 10px; margin-left: -5px; }
.col-handle.detail::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 4px; height: 28px; border-radius: 6px; background: var(--dsw-border-l3); }

.sidebar { height: 100%; display: flex; flex-direction: column; }
.sb-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
.brand { display: flex; align-items: center; gap: 8px; }
.logo-icon { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, rgb(103,158,254) 0%, var(--dsw-primary) 100%); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
.brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--dsw-text-2); border: 1px solid var(--dsw-border-l2); padding: 1px 4px; border-radius: 4px; }
.sb-avatar { width: 28px; height: 28px; border-radius: 50%; background: #e5e7eb; display: grid; place-items: center; font-size: 12px; color: var(--dsw-text-2); cursor: pointer; }
.new-session { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 14px 10px; padding: 8px 0; border: 1px solid var(--dsw-border-l2); border-radius: 8px; background: var(--dsw-bg); color: var(--dsw-text); font-size: 13px; font-weight: 500; cursor: pointer; }
.new-session:hover { border-color: var(--dsw-border-l3); }
.tree { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.tree-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background .15s; position: relative; color: var(--dsw-text-2); }
.tree-item:hover { background: rgba(0,0,0,.05); }
.tree-item.active { background: var(--dsw-primary-soft); color: var(--dsw-text); }
.tree-item.active::before { content: ''; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px; border-radius: 0 3px 3px 0; background: var(--dsw-primary); }
/* 任务执行时的时钟动效 */


.sb-bottom { border-top: 1px solid var(--dsw-border-l1); padding: 10px 12px; }
.settings-btn { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--dsw-text-2); }
.settings-btn:hover { background: rgba(0,0,0,.05); color: var(--dsw-text); }

.center { height: 100%; display: flex; flex-direction: column; }
.c-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--dsw-border-l1); }
.c-title { font-weight: 600; font-size: 14px; padding: 10px 0; }
.tabs { display: flex; align-items: center; gap: 18px; }
.tab { padding: 12px 4px 10px; font-size: 13px; font-weight: 500; color: var(--dsw-text-2); cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: var(--dsw-primary); border-bottom-color: var(--dsw-primary); }


.messages { flex: 1; overflow-y: auto; padding: 24px 24px 0; }
.hint { color: var(--dsw-text-3); text-align: center; margin-top: 48px; font-size: 14px; }
.message { max-width: 800px; margin: 0 auto 24px; }
.message.user { margin-bottom: 16px; }
.message-text { font-size: 14.5px; line-height: 1.7; color: var(--dsw-text); white-space: pre-wrap; }
.tool-card { max-width: 800px; margin: 0 auto 16px; border: 1px solid var(--dsw-border-l2); border-radius: 8px; background: var(--dsw-sidebar-fill); padding: 8px 12px; font-size: 13px; color: var(--dsw-text-2); display: flex; align-items: center; gap: 10px; }
.tool-name { color: var(--dsw-text); font-weight: 500; } .tool-status { color: var(--dsw-green); }
.cite { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; margin: 0 2px; padding: 0 4px; font-size: 11px; color: var(--dsw-primary); background: var(--dsw-primary-soft); border: 1px solid rgba(86,134,254,.4); border-radius: 4px; cursor: pointer; vertical-align: super; }
.input-wrap { padding: 12px 24px 16px; }
.composer { max-width: 800px; margin: 0 auto; border: 1px solid var(--dsw-border-l2); border-radius: 12px; background: var(--dsw-bg); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.composer-top { padding: 10px 12px; }
.composer-input { width: 100%; min-height: 24px; max-height: 160px; border: none; outline: none; resize: none; font-family: inherit; font-size: 14px; line-height: 1.5; background: transparent; color: var(--dsw-text); padding: 4px 0; }
.composer-bottom { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px 10px; }
.composer-tools { display: flex; align-items: center; gap: 6px; }
.tool-btn { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--dsw-text-2); font-size: 13px; cursor: pointer; }
.tool-btn:hover { background: rgba(0,0,0,.05); border-color: var(--dsw-border-l2); }
.composer-right { display: flex; align-items: center; gap: 8px; }
.model-select { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px; color: var(--dsw-text-2); font-size: 13px; cursor: pointer; }
.model-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dsw-green); }
.send-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--dsw-primary); color: #fff; display: grid; place-items: center; cursor: pointer; }
.send-btn:hover { background: var(--dsw-primary-hover); } .send-btn:disabled { opacity: .5; cursor: default; }
.footer-stats { text-align: center; padding: 6px 12px 10px; font-size: 11px; color: var(--dsw-text-3); }

.details { height: 100%; display: flex; flex-direction: column; background: var(--dsw-bg); min-width: 0; }
.details-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--dsw-border-l1); font-weight: 600; font-size: 13px; }


.details-body { flex: 1; overflow-y: auto; padding: 10px; }
.details-empty { color: var(--dsw-text-3); font-size: 13px; text-align: center; margin-top: 40px; }
.src-card { border: 1px solid var(--dsw-border-l2); border-radius: 8px; background: var(--dsw-bg); padding: 10px; margin-bottom: 8px; cursor: pointer; }
.src-card:hover { border-color: var(--dsw-border-l3); }
.src-card.active { border-color: var(--dsw-primary); background: var(--dsw-primary-soft); }
.src-title { font-size: 12px; font-weight: 600; color: var(--dsw-primary); margin-bottom: 4px; }
.src-content { font-size: 12.5px; line-height: 1.6; color: var(--dsw-text-2); }

.dt-expand { position: absolute; top: 50%; transform: translate(-50%,-50%); width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--dsw-border-l2); background: var(--dsw-bg); color: var(--dsw-text-2); display: grid; place-items: center; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); z-index: 5; }
.dt-expand:hover { color: var(--dsw-primary); border-color: var(--dsw-primary); }</style></head>
