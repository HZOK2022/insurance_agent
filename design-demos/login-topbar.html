<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 保险销售知识助手</title>
<style>
:root{
  --primary:#5686FE; --primary-hover:#4176E6; --primary-soft:#E4EDFD;
  --bg:#EBEEF2; --card:#FFFFFF; --text:#0F1115; --text-2:#7F8287; --text-3:#A2A4A6; --green:#22C55E;
  --border:rgba(0,0,0,.1); --border-soft:rgba(0,0,0,.07);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.topbar{height:56px;background:#fff;border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#679EFE,#5686FE);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.name{font-size:15px;font-weight:600}
.badge{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text-2);border:1px solid rgba(0,0,0,.12);padding:1px 5px;border-radius:4px}
.env{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.canvas{flex:1;display:flex;align-items:center;justify-content:center;padding:32px}
.card{width:min(380px,100%);background:#fff;border:1px solid var(--border-soft);border-radius:14px;padding:30px 28px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 12px 36px rgba(15,17,21,.06)}
.brand2{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.logo2{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#679EFE,#5686FE);display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px}
.name2{font-size:16px;font-weight:600}
.tag2{font-size:12px;color:var(--text-2)}
h1{font-size:18px;font-weight:600;margin:0 0 20px}
.field{margin-bottom:14px}
.label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.input{width:100%;height:42px;border:1px solid var(--border);border-radius:9px;padding:0 12px;font:inherit;font-size:14px;color:var(--text);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.pw{position:relative}
.pw .input{padding-right:42px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;background:transparent;color:var(--text-3);cursor:pointer;display:grid;place-items:center;border-radius:6px}
.eye:hover{color:var(--text-2);background:rgba(0,0,0,.04)}
.row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}
.remember{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.remember input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.link{font-size:13px;color:var(--primary);text-decoration:none}
.link:hover{color:var(--primary-hover);text-decoration:underline}
.btn{width:100%;height:44px;border:none;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .08s}
.btn:hover{background:var(--primary-hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.7;cursor:default}
.foot{margin-top:16px;text-align:center;font-size:11.5px;color:var(--text-3)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
      <div class="logo">保</div>
      <div class="name">保险销售知识助手</div>
      <div class="badge">内部</div>
  </div>
  <div class="env"><span class="dot"></span> 生产环境</div>
</div>
<div class="canvas">
  <div class="card">
    <div class="brand2">
      <div class="logo2">保</div>
      <div><div class="name2">保险销售知识助手</div><div class="tag2">内部工作台</div></div>
    </div>
    <h1>登录到工作台</h1>
    <form id="f" autocomplete="off">
      <div class="field">
        <label class="label" for="u">账号</label>
        <input class="input" id="u" placeholder="请输入账号" autocomplete="username">
      </div>
      <div class="field">
        <label class="label" for="p">密码</label>
        <div class="pw">
          <input class="input" id="p" type="password" placeholder="请输入密码" autocomplete="current-password">
          <button type="button" class="eye" id="eye" aria-label="显示密码">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="row">
        <label class="remember"><input type="checkbox" checked> 记住我</label>
        <a class="link" href="#">忘记密码？</a>
      </div>
      <button class="btn" id="submit" type="submit">登录</button>
    </form>
    <div class="foot">仅限授权内部人员使用 · v0.0.1</div>
  </div>
</div>
<script>
const eye=document.getElementById('eye'),p=document.getElementById('p');
eye.addEventListener('click',()=>{p.type=p.type==='password'?'text':'password';});
const f=document.getElementById('f'),btn=document.getElementById('submit');
f.addEventListener('submit',e=>{e.preventDefault();btn.disabled=true;btn.textContent='登录中…';setTimeout(()=>{btn.disabled=false;btn.textContent='登录';},1200);});
</script>
</body>
</html>
